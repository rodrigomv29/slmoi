<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="icon" type="image/x-icon" href="../static/favicon.ico">
    <style>
        body{
            background-color: #2f2f2f;
            color: #ffffff;
            font-family: Arial, sans-serif;

        }
        input {
            display: block;
            margin: 4px 5px 4px 3px;
        }
        label{
            margin: 0;
            padding: 0;
            color: gray;
        }
        a {
            text-decoration: none;
        }
        .error {
            background-color: #d32f2f;
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            margin: 10px 0;
            display: none;
        }
        .error.show {
            display: block;
        }
        .success {
            background-color: #388e3c;
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            margin: 10px 0;
            display: none;
        }
        .success.show {
            display: block;
        }
    </style>
</head>
<body>
    <nav>
        <div>
            <a href="/">Home</a>
            <a href="/signin">Sign In</a>
            <a href="/register">Register</a>
            <a href="/admin">Admin</a>
            <a href="https://rodrigomv29.github.io/">About Rodrigo</a>
        </div>
    </nav>
    <h1>Sign in</h1>
    {% if message and not user_valid %}
    <div class="error show">{{ message }}</div>
    {% elif message and user_valid %}
    <div class="success show">{{ message }}</div>
    {% endif %}

    <form method="post">
        <label for="username">Username</label>
        <input type="text" name="user-name" id="username" required>
        <label for="password">Password</label>
        <input type="password" name="pass-word" id="password" required>
        <button type="submit">Sign in</button>
    </form>
    <p><a href="./register" >Don't have an account? Register here</a></p>
    
</body>
</html>
