<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="icon" type="image/x-icon" href="../static/favicon.ico">
    <style>
        body{
            background-color: #2f2f2f;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
         nav {
            background-color: #232323;
            padding: 12px 0;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        nav div {
            width: 80%;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-right: 30px;
            font-size: 18px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .error {
            background-color: #d32f2f;
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            margin: 10px 0;
            display: none;
        }
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <nav>
        <div>
            <a href="/">Home</a>
            <a href="/signin">Sign In</a>
            <a href="/register">Register</a>
            <a href="/admin">Admin</a>
            <a href="https://rodrigomv29.github.io/">About Rodrigo</a>
        </div>
    </nav>
    <h1>Register</h1>
    <p>Register an account with us!</p>
    {% if error %}
    <div class="error show">{{ error }}</div>
    {% endif %}

    <form method="post">
        <label for="full-name"><input type="text" name="full-name" required>Full Name</label>
        <label for="user-name"><input type="text" name="user-name" required>Username</label>
        <label for="email"><input type="email" name="email" required>Email</label>
        <label for="birthday"><input type="date" name="birthday" required>Date of Birth</label>
        <label for="pass-word"><input type="password" name="pass-word" required>Password</label>
        <label for="pass-word"><input type="password" name="pass-word-2" required>Reenter password</label>
        <button type="submit">Register</button>
        <p>Already have an account <a href="/signin">Sign in!</a></p>
    </form>
    <form action='{{url_for("init_db")}}' method="post"><button>test</button></form>
</body>
</html>
